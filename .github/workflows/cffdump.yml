name: Build cffdump and Decode RD Files

on:
  workflow_dispatch:

jobs:
  build-and-decode:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          python3-pip \
          flex \
          bison \
          glslang-tools \
          libdrm-dev \
          pkg-config
        
        # Обновляем meson до версии 1.4.0+
        pip3 install --upgrade meson
        pip3 install mako
        
        # Добавляем в PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build and decode
      run: |
        chmod +x cffdump_auto.sh
        ./cffdump_auto.sh

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: decoded-rd-files
        path: results/
