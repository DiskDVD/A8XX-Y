name: Cherry-Pick Commits

on:
  workflow_dispatch: 

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          ref: Haks
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch donor repo and cherry-pick
        run: |
          # Подключаем репозиторий donor
          git remote add donor https://github.com/DeriXrace/A8XX-Y
          git fetch donor A8XX
          
          # Делаем cherry-pick прямо в Haks
          echo "Переносим коммиты..."
          git cherry-pick 50cd955 d8df734 ab64739 2fb48d9 df71295 e2f583b 251957f || true

      - name: Push changes
        run: git push origin Haks --force-with-lease
