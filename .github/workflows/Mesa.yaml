name: Sync A8XX with Mesa

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to sync"
        required: true
        default: "A8XX"
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Add Mesa upstream
        run: |
          git remote add upstream https://gitlab.freedesktop.org/mesa/mesa.git
          git fetch upstream main --prune --tags

      - name: Sync branch with Mesa
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git reset --hard upstream/main

          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)" \
            push https://github.com/DiskDVD/A8XX-Y.git "HEAD:${TARGET_BRANCH}" --force
